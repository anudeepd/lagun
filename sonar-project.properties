sonar.organization=anudeepd
sonar.projectKey=anudeepd_lagun
sonar.python.version=3.11, 3.12, 3.13
sonar.sourceEncoding=UTF-8

# Keep the scan on application source. Tests, generated bundles, fixtures,
# build tooling, and the browser test harness live outside it.
sonar.exclusions=.venv/**,.git/**,.github/**,.pytest_cache/**,.ruff_cache/**,.scannerwork/**,artifacts/**,assets/**,build/**,coverage/**,dist/**,dev.py,lagun.egg-info/**,scripts/**,frontend/scripts/**,tests/**,frontend/__mocks__/**,e2e/**,docs/**,**/__pycache__/**,**/*.pyc,**/*.pyo,lagun/static/**,lagun/templates/**,frontend/node_modules/**,frontend/package*.json,frontend/*.config.*,frontend/eslint.config.js,frontend/public/**,frontend/src/__tests__/**,frontend/**/*.test.*,frontend/src/fonts/**,**/*.d.ts,**/*.map,**/*.woff,**/*.woff2,**/*.ttf,**/*.otf,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.svg,ldapgate.example.yaml

sonar.python.coverage.reportPaths=coverage/python-coverage.xml
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
