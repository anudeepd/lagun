name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Lint, lock check and backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the project with its dev extra
        run: uv sync --extra dev
      - name: Check uv.lock is in sync
        run: uv lock --check
      - name: Lint the backend
        run: uv run ruff check lagun/
      - name: Run the backend test suite
        run: uv run pytest tests/ -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly the locked frontend dependencies
        run: npm ci
      - name: Run the frontend test suite
        run: npm run test
